    <text x="0" y="75" fill="#153D39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="29" font-weight="650">Decode the rules no one teaches.</text>
    <text x="0" y="116" fill="#59706E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22">Understand hidden campus norms, practice the real</text>
